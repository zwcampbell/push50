name: Push50
options:
  bundleIdPrefix: com.push50
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Push50:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Push50
      - path: Push50/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.push50.app
        INFOPLIST_FILE: Push50/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: LP5448PXCB
    info:
      path: Push50/Info.plist
      properties:
        CFBundleName: Push 50
        CFBundleDisplayName: Push 50
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: OffWhite
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationsUsageDescription: "Push 50 sends a daily reminder to keep your streak going."
    entitlements:
      path: Push50/Push50.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
